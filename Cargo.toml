[package]
name = "data_fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = {version = "1.0.0", features = [ "derive" ] }
serde_json = "1.0.0"
reqwest = { version = "0.13.4", features = [ "rustls" ] }
thiserror = "2.0.0"
rss = "2.0.0"
scraper = "0.27.0"
axum = "0.8.9"
tokio = { version = "1.0.0", features = [ "full", "parking_lot" ] }
confy = { version = "2.0.0", features = [ "toml" ] }
jiff = "0.2.35"